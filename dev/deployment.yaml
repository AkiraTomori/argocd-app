apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-myapp
spec:
  selector:
    matchLabels:
      app: myapp
  replicas: {{ .Values.replicaCount }}  
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}" # <--- Dùng biến
        ports:
        - containerPort: {{ .Values.service.targetPort }}